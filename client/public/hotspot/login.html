<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiberasinet - Hotspot Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="brand-header">
            <img src="img/logo.png" alt="Fiberasinet Logo" class="logo">
            <h1>Fiberasinet</h1>
        </header>

        <!-- Login Section -->
        <div class="card">
            <div class="status-box">
                <p class="error-msg">$(error)</p>
            </div>

            <form name="login" action="$(link-login-only)" method="post">
                <input type="hidden" name="dst" value="$(link-orig)">
                <input type="hidden" name="popup" value="true">
                
                <div class="input-group">
                    <label>Kode Voucher</label>
                    <input type="text" name="username" placeholder="MASUKKAN KODE VOUCHER" class="voucher-input" autofocus required>
                    <input type="hidden" name="password" value="">
                </div>

                <button type="submit" class="btn-primary">MASUK INTERNET</button>
            </form>
        </div>

        <!-- Packages Section -->
        <div class="section-title">
            <h3>Beli Paket Internet</h3>
        </div>

        <div class="package-list">
            <!-- Paket 1 Jam -->
            <div class="package-card" onclick="selectPackage('1h')">
                <div class="pkg-header">
                    <h3>Paket Kilat</h3>
                    <span class="price">Rp 2.000</span>
                </div>
                <div class="pkg-details">
                    <span>1 Jam</span> • <span>5 Mbps</span>
                </div>
                <button class="btn-select">Pilih</button>
            </div>

            <!-- Paket 24 Jam -->
            <div class="package-card" onclick="selectPackage('1d')">
                <div class="pkg-header">
                    <h3>Paket Harian</h3>
                    <span class="price">Rp 5.000</span>
                </div>
                <div class="pkg-details">
                    <span>24 Jam</span> • <span>10 Mbps</span>
                </div>
                <button class="btn-select">Pilih</button>
            </div>

            <!-- Paket 30 Hari -->
            <div class="package-card featured" onclick="selectPackage('1m')">
                <div class="badge-featured">TERLARIS</div>
                <div class="pkg-header">
                    <h3>Paket Keluarga</h3>
                    <span class="price">Rp 150.000</span>
                </div>
                <div class="pkg-details">
                    <span>30 Hari</span> • <span>20 Mbps</span>
                </div>
                <button class="btn-select">Pilih</button>
            </div>
        </div>
        
        <div class="card mt-4">
            <p style="font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 10px;">
                Lanjut ke pembayaran via E-Wallet
            </p>
            <a href="/checkout" id="buy-link" class="btn-primary" style="text-decoration: none; display: block; text-align: center;">
                BAYAR SEKARANG
            </a>
        </div>

        <div class="help-section">
            <a href="https://wa.me/6281234567890" class="link-wa">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                Bantuan WhatsApp
            </a>
        </div>

        <footer class="footer">
            <p>&copy; 2024 Fiberasinet Hotspot</p>
        </footer>
    </div>
    
    <script>
        function selectPackage(id) {
            window.location.href = '/checkout?pkg=' + id;
        }
    </script>
    <style>
        .section-title {
            margin: 24px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title h3 {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }
        .section-title::before {
            content: '';
            display: block;
            width: 4px;
            height: 24px;
            background-color: var(--primary-color);
            border-radius: 4px;
        }
        .mt-4 { margin-top: 16px; }
    </style>
</body>
</html>
